name: Android APK

on:
  push:
    branches: [main, ccr-5be55da2-8ydr2j]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish the APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Optional: a fixed signing key lets new builds install over old ones
      # without losing progress. Without these secrets the debug key is used.
      - name: Configure release signing
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPERTIES
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPERTIES

      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ruqa-chess.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ruqa-chess-apk
          path: ruqa-chess.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.0-build.${{ github.run_number }}" ruqa-chess.apk \
            --target "${{ github.sha }}" \
            --title "رقعة — نسخة ${{ github.run_number }}" \
            --notes-file .github/release-notes.md \
            --latest
